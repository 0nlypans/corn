<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Autoplay</title>
<style>
body {
margin: 0;
background: black;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
}
video {
width: 100%;
height: auto;
max-height: 100vh;
}
</style>
</head>
<body>
<video id="myVideo" autoplay muted playsinline>
<source src="video.mp4" type="video/mp4">
Your browser does not support the video tag.
</video>
<script>
// Attiva l'audio al primo tocco (se vuoi farlo ripartire con audio)
document.addEventListener('click', () => {
const video = document.getElementById('myVideo');
video.muted = false;
video.play();
}, { once: true });
</script>
</body>
</html>
